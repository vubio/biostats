name: BioStats regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy statsmodels pandas pytest matplotlib
      - run: PYTHONPATH=. pytest -q tests/test_engine.py tests/test_comparisons.py tests/test_families.py tests/test_descriptive.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test-xy.mjs
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          for script in src/*.js; do node --check "$script"; done
      - run: node --test tests/presets.test.mjs tests/charts-preset.test.mjs tests/test-guidance.mjs
